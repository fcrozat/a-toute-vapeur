<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#ff8c1a">
<title>Le Moteur Farfelu</title>
<style>
/* ============================================================
   Le Moteur Farfelu — un moteur de voiture à energies farfelues
   Un seul fichier, aucune dependance, fait pour la tablette.
   ============================================================ */

:root {
  --orange: #ff8c1a;
  --rouge: #e63946;
  --rouge-fonce: #a4161a;
  --encre: #2b2d42;
  --violet: #7209b7;
  --jaune: #ffd166;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: "Comic Sans MS", "Chalkboard SE", "Comic Neue", "Marker Felt", cursive, sans-serif;
  background: linear-gradient(180deg, #ffe8c8 0%, #ffd9a0 45%, #ffc36e 100%);
  color: var(--encre);
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}

main {
  display: flex;
  flex-direction: column;
  gap: 8px;
  height: 100vh;
  height: 100dvh;
  padding: 8px 12px 10px;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 4px;
  flex: 0 0 auto;
}
header h1 { margin: 0; font-size: 24px; letter-spacing: .5px; }
#bouton-son {
  background: #fff;
  border: 2px solid #dee2e6;
  border-radius: 50%;
  width: 44px; height: 44px;
  font-size: 20px;
  cursor: pointer;
}

/* ---------------- La piste ---------------- */
.piste {
  position: relative;
  flex: 0 0 auto;
  height: 118px;
  border-radius: 18px;
  overflow: hidden;
  background: linear-gradient(#7ec8e3 0%, #bfe8f5 62%, #d9f0f7 100%);
  box-shadow: inset 0 0 0 3px rgba(0,0,0,.06);
}
.route {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 44%;
  background: #4d4d5c;
}
.route::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 4px;
  background: rgba(255,255,255,.35);
}
.bande {
  position: absolute;
  left: 0; right: 0;
  top: 48%;
  height: 5px;
  background: repeating-linear-gradient(90deg, #fff 0 42px, transparent 42px 84px);
  animation: defilement var(--duree-route, 1.6s) linear infinite;
}
@keyframes defilement { to { background-position-x: -84px; } }

.voiture {
  position: absolute;
  left: 15%; bottom: 16%;
  font-size: 54px;
  line-height: 1;
  transform: scaleX(-1);
  z-index: 3;
}
.voiture.marche { animation: tremble .16s infinite; }
@keyframes tremble {
  0%, 100% { transform: scaleX(-1) translateY(0); }
  50%      { transform: scaleX(-1) translateY(-2.5px); }
}
.voiture.fou { animation: tremble .16s infinite, roue-couleurs 1.4s linear infinite; }
@keyframes roue-couleurs {
  from { filter: hue-rotate(0deg) saturate(1.4); }
  to   { filter: hue-rotate(360deg) saturate(1.4); }
}

.fumee {
  position: absolute;
  left: calc(15% + 46px); bottom: 20%;
  font-size: 24px;
  opacity: 0;
  z-index: 2;
}
.fumee.affichee { animation: fumette 1.1s infinite; }
@keyframes fumette {
  0%   { opacity: 0; transform: translate(0, 0) scale(.6); }
  35%  { opacity: .85; }
  100% { opacity: 0; transform: translate(30px, -16px) scale(1.5); }
}
.fumee.noire { filter: brightness(.3); }
.fumee.clare { filter: blur(.5px) brightness(1.3); }

.flamme {
  position: absolute;
  left: calc(15% + 40px); bottom: 18%;
  font-size: 22px;
  display: none;
  z-index: 2;
}
.flamme.affichee { display: block; animation: battement-flamme .12s infinite; }
@keyframes battement-flamme { 50% { transform: scale(1.3) rotate(8deg); } }

.etincelles {
  position: absolute;
  left: 16%; bottom: 72%;
  font-size: 22px;
  display: none;
  z-index: 3;
}
.etincelles.affichee { display: block; animation: twinkle .8s infinite; }
@keyframes twinkle {
  0%, 100% { transform: scale(.8); opacity: .7; }
  50%      { transform: scale(1.25); opacity: 1; }
}

/* ---------------- Le moteur ---------------- */
.moteur {
  flex: 0 0 auto;
  background: #3a3f52;
  border-radius: 18px;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 16px;
  box-shadow: inset 0 0 0 3px rgba(255,255,255,.07), 0 4px 0 rgba(0,0,0,.15);
}
.moteur.secoue { animation: secoue .4s; }
@keyframes secoue {
  25% { transform: translateX(-9px); }
  50% { transform: translateX(9px); }
  75% { transform: translateX(-5px); }
}
.moteur-titre { color: #fff; font-size: 20px; font-weight: bold; letter-spacing: 1px; }
.moteur-sous { color: #adb5bd; font-size: 11px; margin-top: 2px; }
.moteur-etiquette { width: 118px; flex: 0 0 auto; }

.fiches { display: flex; gap: 14px; flex: 1; justify-content: center; }
.fiche {
  width: 86px; height: 86px;
  border-radius: 50%;
  border: 4px dashed rgba(255,255,255,.4);
  background: rgba(255,255,255,.08);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: rgba(255,255,255,.55);
  font-size: 11px;
  position: relative;
  touch-action: none;
  cursor: grab;
  transition: transform .12s, border-color .12s;
}
.fiche .emoji { font-size: 30px; line-height: 1.1; }
.fiche .nom { font-size: 10px; text-align: center; color: inherit; padding: 0 2px; }
.fiche.cible {
  border-color: var(--jaune);
  background: rgba(255, 209, 102, .3);
  transform: scale(1.1);
}
.fiche.pleine { border-style: solid; border-color: #fff; color: #2b2d42; }

/* ---------------- Les jauges ---------------- */
.jauges {
  flex: 0 0 auto;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}
.jauge {
  background: rgba(255,255,255,.8);
  border-radius: 12px;
  padding: 6px 10px 8px;
}
.jauge .libelle {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  margin-bottom: 4px;
}
.barre {
  height: 12px;
  background: #e9ecef;
  border-radius: 6px;
  overflow: hidden;
}
.barre i {
  display: block;
  height: 100%;
  width: 0;
  border-radius: 6px;
  transition: width .3s;
}

/* ---------------- Boutons ---------------- */
.actions {
  flex: 0 0 auto;
  display: flex;
  gap: 10px;
  align-items: center;
}
button {
  font-family: inherit;
  border: none;
  border-radius: 14px;
  padding: 10px 18px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  touch-action: manipulation;
}
#bouton-go {
  background: var(--rouge);
  color: #fff;
  font-size: 20px;
  padding: 12px 30px;
  box-shadow: 0 5px 0 var(--rouge-fonce);
}
#bouton-go:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--rouge-fonce); }
#bouton-vider { background: #fff; border: 2px solid #adb5bd; color: #495057; }
.record {
  margin-left: auto;
  background: rgba(255,255,255,.8);
  border-radius: 10px;
  padding: 8px 12px;
  font-size: 14px;
}

/* ---------------- Braise, la mecanicienne ---------------- */
.braise {
  flex: 0 0 auto;
  background: #fff;
  border-left: 6px solid var(--orange);
  border-radius: 10px;
  padding: 8px 12px;
  font-size: 14px;
  margin: 0;
  min-height: 42px;
  display: flex;
  align-items: center;
}

/* ---------------- L'etabli (les cartes d'energie) ---------------- */
.etabli {
  flex: 1;
  min-height: 120px;
  display: flex;
  flex-direction: column;
  background: rgba(255,255,255,.55);
  border-radius: 18px;
  padding: 8px 10px 10px;
}
.etabli-titre { margin: 0 4px 6px; font-size: 13px; color: #555; }
.rail {
  flex: 1;
  display: flex;
  gap: 10px;
  overflow-x: auto;
  overflow-y: hidden;
  padding: 8px 4px;
  -webkit-overflow-scrolling: touch;
  scroll-snap-type: x proximity;
}
.carte {
  flex: 0 0 auto;
  width: 108px;
  border-radius: 14px;
  padding: 10px 8px 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  border: 3px solid rgba(0,0,0,.1);
  box-shadow: 0 3px 0 rgba(0,0,0,.15);
  touch-action: pan-x;
  cursor: grab;
  scroll-snap-align: start;
}
.carte .emoji { font-size: 34px; line-height: 1.1; }
.carte .nom { font-size: 12px; font-weight: bold; text-align: center; }
.carte.dans-le-moteur { display: none; }
.carte.tape { animation: wiggle .35s; }
@keyframes wiggle {
  25% { transform: rotate(-5deg); }
  75% { transform: rotate(5deg); }
}
.carte.fantome {
  position: fixed;
  z-index: 1000;
  pointer-events: none;
  transform: translate(-50%, -60%) scale(1.12) rotate(-4deg);
  opacity: .95;
  margin: 0;
}

/* ---------------- Les voiles (course + resultat) ---------------- */
.voile {
  position: fixed;
  inset: 0;
  background: rgba(20, 20, 35, .88);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 500;
}
.voile.cache { display: none; }

.course { width: min(94vw, 900px); text-align: center; color: #fff; }
#titre-course { margin: 0 0 4px; font-size: 34px; letter-spacing: 2px; }
#temps-course { margin: 0 0 16px; font-size: 22px; color: var(--jaune); }
.circuit { display: flex; flex-direction: column; gap: 16px; }
.couloir {
  position: relative;
  height: 74px;
  background: #4d4d5c;
  border-radius: 12px;
  overflow: hidden;
}
.couloir::before {
  content: "";
  position: absolute;
  left: 0; right: 0; top: 50%;
  height: 4px;
  background: repeating-linear-gradient(90deg, rgba(255,255,255,.5) 0 34px, transparent 34px 68px);
}
.arrivee {
  position: absolute;
  right: 8px; top: 0; bottom: 0;
  width: 14px;
  background: repeating-linear-gradient(45deg, #fff 0 8px, #111 8px 16px);
}
.voiture-course {
  position: absolute;
  left: 2%; bottom: 10px;
  font-size: 42px;
  line-height: 1;
  transform: scaleX(-1);
  z-index: 2;
}
.etiquette {
  position: absolute;
  left: 10px; top: 5px;
  font-size: 12px;
  font-weight: bold;
  color: #fff;
  background: rgba(0,0,0,.35);
  border-radius: 8px;
  padding: 2px 8px;
}

.panneau {
  background: #fff;
  border-radius: 22px;
  padding: 26px 30px 28px;
  width: min(92vw, 560px);
  text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,.4);
}
#res-emoji { font-size: 64px; line-height: 1; }
.panneau h2 { margin: 10px 0 8px; font-size: 26px; color: var(--rouge); }
#res-texte { margin: 0 0 14px; font-size: 15px; color: #495057; }
.res-temps {
  background: #f1f3f5;
  border-radius: 10px;
  padding: 9px;
  font-size: 14px;
  margin-bottom: 10px;
}
#res-score { font-size: 18px; font-weight: bold; margin-bottom: 4px; }
#res-record { font-size: 14px; color: #555; margin-bottom: 4px; }
.res-boutons {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin-top: 18px;
  flex-wrap: wrap;
}
.res-boutons button { font-size: 16px; padding: 12px 18px; }
#bouton-revoir { background: var(--orange); color: #fff; box-shadow: 0 4px 0 #c96a08; }
#bouton-nouveau { background: #fff; border: 2px solid #adb5bd; color: #495057; }

/* ---------------- Confettis ---------------- */
.confetti {
  position: fixed;
  top: -20px;
  width: 10px;
  height: 16px;
  z-index: 600;
  pointer-events: none;
  border-radius: 2px;
  animation: chute var(--d, 2s) linear forwards;
}
@keyframes chute { to { transform: translateY(110vh) rotate(720deg); } }

/* ---------------- Ecrans petits ---------------- */
@media (max-height: 640px) {
  header h1 { font-size: 19px; }
  .piste { height: 92px; }
  .voiture { font-size: 42px; }
  .fiche { width: 70px; height: 70px; }
  .fiche .emoji { font-size: 24px; }
  .carte { width: 96px; }
  .carte .emoji { font-size: 28px; }
  .moteur-etiquette { width: 90px; }
  .moteur-titre { font-size: 16px; }
}
</style>
</head>
<body>
<main>
  <header>
    <h1>🔧 Le Moteur Farfelu</h1>
    <button id="bouton-son" aria-label="son">🔊</button>
  </header>

  <!-- La piste : la voiture roule selon la vitesse du moteur -->
  <section class="piste" id="piste" aria-label="piste d'essai">
    <div class="route">
      <div class="bande" id="bande"></div>
      <div class="etincelles" id="etincelles">✨</div>
      <div class="flamme" id="flamme">🔥</div>
      <div class="fumee" id="fumee">💨</div>
      <div class="voiture" id="voiture">🚗</div>
    </div>
  </section>

  <!-- Le moteur : trois fiches d'energie -->
  <section class="moteur" id="moteur" aria-label="moteur">
    <div class="moteur-etiquette">
      <div class="moteur-titre">MOTEUR</div>
      <div class="moteur-sous">3 fiches d'énergie</div>
    </div>
    <div class="fiches">
      <div class="fiche" data-fiche="0"></div>
      <div class="fiche" data-fiche="1"></div>
      <div class="fiche" data-fiche="2"></div>
    </div>
  </section>

  <!-- Les jauges -->
  <section class="jauges" aria-label="jauges">
    <div class="jauge">
      <div class="libelle"><span>🏁 Vitesse</span><b id="val-vitesse">0</b></div>
      <div class="barre"><i id="barre-vitesse" style="background:#e63946"></i></div>
    </div>
    <div class="jauge">
      <div class="libelle"><span>🌀 Bizarre</span><b id="val-bizarre">0</b></div>
      <div class="barre"><i id="barre-bizarre" style="background:#7209b7"></i></div>
    </div>
    <div class="jauge">
      <div class="libelle"><span>☁️ Fumée</span><b id="val-pollution">0</b></div>
      <div class="barre"><i id="barre-pollution" style="background:#6c757d"></i></div>
    </div>
    <div class="jauge">
      <div class="libelle"><span>🔊 Bruit</span><b id="val-bruit">0</b></div>
      <div class="barre"><i id="barre-bruit" style="background:#f8961e"></i></div>
    </div>
  </section>

  <section class="actions">
    <button id="bouton-go">🏁 LANCE !</button>
    <button id="bouton-vider">🧹 Vider</button>
    <div class="record" id="record">Record : 0</div>
  </section>

  <p class="braise" id="braise-texte"></p>

  <!-- L'etabli : les cartes d'energie a glisser -->
  <section class="etabli" aria-label="etabli">
    <p class="etabli-titre">🧰 L'établi — glisse une énergie dans les fiches (tape une carte pour la faire parler)</p>
    <div class="rail" id="rail"></div>
  </section>
</main>

<!-- Voile de course -->
<div id="voile-course" class="voile cache">
  <div class="course">
    <h2 id="titre-course">COURSE !</h2>
    <p id="temps-course">0,00 s</p>
    <div class="circuit">
      <div class="couloir">
        <div class="arrivee"></div>
        <div class="etiquette" id="etiquette-joueur"></div>
        <div class="voiture-course" id="voiture-course">🚗</div>
      </div>
      <div class="couloir">
        <div class="arrivee"></div>
        <div class="etiquette" id="etiquette-adversaire"></div>
        <div class="voiture-course" id="voiture-adversaire">🚙</div>
      </div>
    </div>
  </div>
</div>

<!-- Voile de resultat -->
<div id="voile-resultat" class="voile cache">
  <div class="panneau">
    <div id="res-emoji">🏆</div>
    <h2 id="res-titre"></h2>
    <p id="res-texte"></p>
    <div class="res-temps" id="res-temps"></div>
    <div id="res-score"></div>
    <div id="res-record"></div>
    <div class="res-boutons">
      <button id="bouton-revoir">🔧 Revoir le moteur</button>
      <button id="bouton-nouveau">🧹 Nouveau moteur</button>
    </div>
  </div>
</div>

<script>

   1. Les donnees du jeu
   ============================================================ */

/* ============================================================
   2. L'etat
   ============================================================ */

const fichesEtat = [null, null, null]; // ids de sources, ou null
let mute = lireMemoire("mf-mute") === "1";
let record = parseInt(lireMemoire("mf-record") || "0", 10) || 0;
let courseEnCours = false;
let trainee = null; // { id, origineFiche, origine, x0, y0, typeEcran, active, fantome }

function lireMemoire(cle) {
  try { return localStorage.getItem(cle); } catch (_) { return null; }
}
function ecrireMemoire(cle, valeur) {
  try { localStorage.setItem(cle, valeur); } catch (_) {}
}
function choisis(liste) {
  return liste[Math.floor(Math.random() * liste.length)];
}
function sourceParId(id) {
  return id ? PAR_ID.get(id) : null;
}
function sourceAleatoire() {
  return choisis(SOURCES_REELLES);
}
function fmt(t) {
  return t.toFixed(2).replace(".", ",");
}

/* ============================================================
   3. Les sons (WebAudio, aucun fichier)
   ============================================================ */

let contexteAudio = null;
let nœudHum = null;

function assureAudio() {
  if (contexteAudio) return contexteAudio;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  contexteAudio = new AC();
  if (contexteAudio.state === "suspended") contexteAudio.resume();
  return contexteAudio;
}

function demarreHum() {
  if (mute || nœudHum) return;
  const ctx = assureAudio();
  if (!ctx) return;
  const osc1 = ctx.createOscillator();
  const osc2 = ctx.createOscillator();
  const filtre = ctx.createBiquadFilter();
  const gain = ctx.createGain();
  osc1.type = "sawtooth";  osc1.frequency.value = 60;
  osc2.type = "triangle";  osc2.frequency.value = 40;
  filtre.type = "lowpass"; filtre.frequency.value = 260;
  gain.gain.value = 0;
  osc1.connect(filtre);
  osc2.connect(filtre);
  filtre.connect(gain);
  gain.connect(ctx.destination);
  osc1.start();
  osc2.start();
  gain.gain.setTargetAtTime(0.045, ctx.currentTime, 0.1);
  nœudHum = { osc1, osc2, gain, ctx };
}

function arreteHum() {
  if (!nœudHum) return;
  const { osc1, osc2, gain, ctx } = nœudHum;
  nœudHum = null;
  gain.gain.setTargetAtTime(0, ctx.currentTime, 0.05);
  setTimeout(() => { try { osc1.stop(); osc2.stop(); } catch (_) {} }, 300);
}

function ajusteHum(vitesse) {
  if (!nœudHum) return;
  const { osc1, osc2, ctx } = nœudHum;
  osc1.frequency.setTargetAtTime(50 + vitesse * 5, ctx.currentTime, 0.15);
  osc2.frequency.setTargetAtTime(35 + vitesse * 3, ctx.currentTime, 0.15);
}

function bip(frequence, duree, type, volume, delai) {
  if (mute) return;
  const ctx = assureAudio();
  if (!ctx) return;
  const t0 = ctx.currentTime + (delai || 0);
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type || "sine";
  osc.frequency.value = frequence;
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(volume || 0.15, t0 + 0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duree);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + duree + 0.05);
}

function sonPose()    { bip(340, 0.09, "sine", 0.2);  bip(210, 0.1, "sine", 0.15, 0.05); }
function sonRetour()  { bip(210, 0.08, "sine", 0.15); bip(340, 0.09, "sine", 0.12, 0.05); }
function sonToucher() { bip(520, 0.05, "sine", 0.08); }

function sonVroom() {
  if (mute) return;
  const ctx = assureAudio();
  if (!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = "sawtooth";
  osc.frequency.setValueAtTime(55, ctx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(240, ctx.currentTime + 0.35);
  osc.frequency.exponentialRampToValueAtTime(90, ctx.currentTime + 0.9);
  gain.gain.setValueAtTime(0.12, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 1);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + 1.05);
}

function sonVictoire() {
  [523, 659, 784, 1047].forEach((f, i) => bip(f, 0.18, "square", 0.1, i * 0.13));
}
function sonDefaite() {
  [392, 311, 247].forEach((f, i) => bip(f, 0.22, "triangle", 0.14, i * 0.18));
}

/* ============================================================
   4. Le rendu
   ============================================================ */

function construitEtabli() {
  const rail = document.getElementById("rail");
  for (const s of SOURCES) {
    const carte = document.createElement("div");
    carte.className = "carte";
    carte.dataset.id = s.id;
    carte.style.background = s.couleur;
    const e = document.createElement("div");
    e.className = "emoji";
    e.textContent = s.emoji;
    const n = document.createElement("div");
    n.className = "nom";
    n.textContent = s.nom;
    carte.append(e, n);
    rail.append(carte);
    attacheGlisser(carte, () => carte.dataset.id, -1);
  }
  rail.addEventListener("contextmenu", (ev) => ev.preventDefault());
}

function metAJourEtabli() {
  const dansLeMoteur = new Set(fichesEtat.filter(Boolean));
  for (const carte of document.querySelectorAll(".carte")) {
    const s = PAR_ID.get(carte.dataset.id);
    const cachee = dansLeMoteur.has(carte.dataset.id) && s && !s.mystere;
    carte.classList.toggle("dans-le-moteur", cachee);
  }
}

function metAJourFiches() {
  const fiches = document.querySelectorAll(".fiche");
  fiches.forEach((fiche, i) => {
    const s = sourceParId(fichesEtat[i]);
    fiche.classList.toggle("pleine", !!s);
    if (s) {
      fiche.style.background = s.couleur;
      fiche.replaceChildren();
      const e = document.createElement("div");
      e.className = "emoji";
      e.textContent = s.emoji;
      const n = document.createElement("div");
      n.className = "nom";
      n.textContent = s.nom;
      fiche.append(e, n);
    } else {
      fiche.style.background = "";
      fiche.replaceChildren();
      const e = document.createElement("div");
      e.className = "emoji";
      e.textContent = "❔";
      const n = document.createElement("div");
      n.className = "nom";
      n.textContent = "fiche " + (i + 1);
      fiche.append(e, n);
    }
  });
}

function calculeStats() {
  const stats = { vitesse: 0, bizarre: 0, pollution: 0, bruit: 0, nombre: 0 };
  for (const id of fichesEtat) {
    const s = sourceParId(id);
    if (!s || s.mystere) continue;
    stats.vitesse += s.vitesse;
    stats.bizarre += s.bizarre;
    stats.pollution += s.pollution;
    stats.bruit += s.bruit;
    stats.nombre++;
  }
  return stats;
}

function definitJauge(cle, valeur, max) {
  document.getElementById("barre-" + cle).style.width = Math.min(100, (valeur / max) * 100) + "%";
  document.getElementById("val-" + cle).textContent = valeur;
}

function metAJourJauges(stats) {
  definitJauge("vitesse", stats.vitesse, 30);
  definitJauge("bizarre", stats.bizarre, 30);
  definitJauge("pollution", stats.pollution, 30);
  definitJauge("bruit", stats.bruit, 30);
}

function metAJourVoiture(stats) {
  const piste = document.getElementById("piste");
  const voiture = document.getElementById("voiture");
  const bande = document.getElementById("bande");
  const fumee = document.getElementById("fumee");
  const flamme = document.getElementById("flamme");
  const etincelles = document.getElementById("etincelles");

  if (stats.vitesse > 0) {
    voiture.classList.add("marche");
    bande.style.animationPlayState = "running";
    piste.style.setProperty("--duree-route", Math.max(0.15, 1.5 - stats.vitesse * 0.042).toFixed(2) + "s");
  } else {
    voiture.classList.remove("marche");
    bande.style.animationPlayState = "paused";
  }
  voiture.classList.toggle("fou", stats.bizarre >= 12);
  fumee.classList.toggle("affichee", stats.vitesse > 0);
  fumee.classList.toggle("noire", stats.pollution >= 12);
  fumee.classList.toggle("clare", stats.pollution < 6 && stats.vitesse > 0);
  flamme.classList.toggle("affichee", stats.vitesse >= 20);
  etincelles.classList.toggle("affichee", stats.bizarre >= 12);
}

function metAJourTout() {
  const stats = calculeStats();
  metAJourEtabli();
  metAJourFiches();
  metAJourJauges(stats);
  metAJourVoiture(stats);
  document.getElementById("record").textContent = "Record : " + record;
  if (stats.nombre > 0) demarreHum();
  else arreteHum();
  ajusteHum(stats.vitesse);
}

function braise(texte) {
  document.getElementById("braise-texte").textContent = "💬 Braise : " + texte;
}

function secoueMoteur() {
  const m = document.getElementById("moteur");
  m.classList.remove("secoue");
  void m.offsetWidth; // relance l'animation
  m.classList.add("secoue");
}

/* ============================================================
   5. Le glisser-deposer (pointeur : doigt, stylet, souris)
   ============================================================ */

function attacheGlisser(el, obtientId, origineFiche) {
  el.addEventListener("pointerdown", (e) => {
    if (courseEnCours) return;
    const id = obtientId();
    if (!id) return; // fiche vide : rien a faire
    e.preventDefault();
    trainee = {
      id,
      origineFiche,
      origine: el,
      x0: e.clientX,
      y0: e.clientY,
      typeEcran: e.pointerType || "mouse",
      active: false,
      fantome: null,
    };
    try { el.setPointerCapture(e.pointerId); } catch (_) {}
  });
}

function demarreFantome(e) {
  const fantome = trainee.origine.cloneNode(true);
  fantome.classList.add("fantome");
  document.body.append(fantome);
  trainee.active = true;
  trainee.fantome = fantome;
  deplaceFantome(e.clientX, e.clientY);
  sonToucher();
}

function deplaceFantome(x, y) {
  const f = trainee && trainee.fantome;
  if (f) { f.style.left = x + "px"; f.style.top = y + "px"; }
}

function surligneFiche(x, y) {
  nettoieCibles();
  const el = document.elementFromPoint(x, y);
  const fiche = el ? el.closest(".fiche") : null;
  if (fiche) fiche.classList.add("cible");
}

function nettoieCibles() {
  for (const f of document.querySelectorAll(".fiche.cible")) f.classList.remove("cible");
}

function surBouge(e) {
  if (!trainee) return;
  const dx = e.clientX - trainee.x0;
  const dy = e.clientY - trainee.y0;
  if (!trainee.active) {
    if (trainee.origineFiche === -1 && trainee.typeEcran === "touch") {
      // doigt sur l'etabli : on ne debute que sur un mouvement nettement
      // vertical (l'horizontale appartient au deroulement de la rangée)
      if (Math.abs(dy) > 14 && Math.abs(dy) > Math.abs(dx)) demarreFantome(e);
    } else if (Math.hypot(dx, dy) > 10) {
      demarreFantome(e);
    }
    return;
  }
  deplaceFantome(e.clientX, e.clientY);
  surligneFiche(e.clientX, e.clientY);
}

function surRelache(e) {
  if (!trainee) return;
  const t = trainee;
  trainee = null;
  nettoieCibles();

  if (t.active) {
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const ficheEl = el ? el.closest(".fiche") : null;
    if (t.fantome) t.fantome.remove();

    if (ficheEl) {
      const index = parseInt(ficheEl.dataset.fiche, 10);
      if (index !== t.origineFiche) placeSource(t.id, index, t.origineFiche);
    } else if (t.origineFiche !== -1) {
      fichesEtat[t.origineFiche] = null; // retour a l'etabli
      braise(choisis(PHRASES_RETOUR));
      sonRetour();
      metAJourTout();
    }
  } else if (t.origineFiche !== -1) {
    // tap sur une fiche pleine : l'energie retourne a l'etabli
    fichesEtat[t.origineFiche] = null;
    braise(choisis(PHRASES_RETOUR));
    sonRetour();
    metAJourTout();
  } else {
    // tap sur une carte de l'etabli : Braise la presente
    const s = sourceParId(t.id);
    if (s) {
      braise(s.phrase);
      t.origine.classList.add("tape");
      setTimeout(() => t.origine.classList.remove("tape"), 380);
      sonToucher();
    }
  }
}

window.addEventListener("pointermove", surBouge);
window.addEventListener("pointerup", surRelache);
window.addEventListener("pointercancel", () => {
  if (!trainee) return;
  if (trainee.fantome) trainee.fantome.remove();
  trainee = null;
  nettoieCibles();
});

function placeSource(id, index, origineFiche) {
  let reelId = id;
  let preface = "";
  if (PAR_ID.get(id) && PAR_ID.get(id).mystere) {
    reelId = sourceAleatoire().id;
    preface = choisis(PHRASES_MYSTERE) + " ";
  }
  fichesEtat[index] = reelId;
  if (origineFiche !== -1) fichesEtat[origineFiche] = null;
  metAJourTout();
  sonPose();
  const s = sourceParId(reelId);
  braise(preface + s.phrase);
}

/* ============================================================
   6. La course
   ============================================================ */

function positionneVoiture(el, progression) {
  el.style.left = (2 + progression * 84) + "%";
}

function lanceCourse(stats) {
  courseEnCours = true;
  braise(choisis(PHRASES_DEPART));

  const adverse = choisis(ADVERSAIRES);
  const dureeJoueur = Math.min(9, Math.max(2.6, 52 / stats.vitesse));
  const dureeAdverse = 3.2 + Math.random() * 5.5;

  const voitureJoueur = document.getElementById("voiture-course");
  const voitureAdversaire = document.getElementById("voiture-adversaire");
  voitureJoueur.textContent = "🚗";
  voitureAdversaire.textContent = adverse.emoji;

  const mini = fichesEtat
    .filter(Boolean)
    .map((id) => { const s = sourceParId(id); return s ? s.emoji : ""; })
    .join(" ");
  document.getElementById("etiquette-joueur").textContent = "TOI  " + mini;
  document.getElementById("etiquette-adversaire").textContent = adverse.nom;

  positionneVoiture(voitureJoueur, 0);
  positionneVoiture(voitureAdversaire, 0);
  document.getElementById("temps-course").textContent = "0,00 s";
  document.getElementById("voile-course").classList.remove("cache");

  sonVroom();
  ajusteHum(stats.vitesse * 1.6);

  const depart = performance.now();
  const durer = (now) => {
    const t = (now - depart) / 1000;
    const pJ = Math.min(1, t / dureeJoueur);
    const pA = Math.min(1, t / dureeAdverse);
    positionneVoiture(voitureJoueur, pJ);
    positionneVoiture(voitureAdversaire, pA);
    document.getElementById("temps-course").textContent = fmt(t) + " s";
    if (pJ < 1 && pA < 1) {
      requestAnimationFrame(durer);
    } else {
      setTimeout(() => finCourse(stats, dureeJoueur, dureeAdverse, dureeJoueur <= dureeAdverse), 600);
    }
  };
  requestAnimationFrame(durer);
}

function finCourse(stats, tempsJoueur, tempsAdverse, gagne) {
  courseEnCours = false;
  ajusteHum(stats.vitesse);

  const score = Math.max(
    0,
    stats.vitesse * 10 + stats.bizarre * 7 - stats.pollution * 3 - stats.bruit * 2
  );
  const nouveauRecord = score > record;
  if (nouveauRecord) {
    record = score;
    ecrireMemoire("mf-record", String(record));
  }

  const verdict = choisisVerdict(stats);
  let emojiRes = verdict.emoji;
  if (gagne) emojiRes = nouveauRecord ? "🏆" : "🎉";
  document.getElementById("res-emoji").textContent = emojiRes;
  document.getElementById("res-titre").textContent = (gagne ? "VICTOIRE ! " : "DÉFAITE… mais ") + verdict.titre;
  document.getElementById("res-texte").textContent = verdict.texte;
  const resTemps = document.getElementById("res-temps");
  resTemps.replaceChildren();
  const gras = (texte) => {
    const b = document.createElement("b");
    b.textContent = texte;
    return b;
  };
  resTemps.append("Ton temps : ", gras(fmt(tempsJoueur) + " s"), " · Adversaire : ", gras(fmt(tempsAdverse) + " s"));
  document.getElementById("res-score").textContent = "Score farfelu : " + score;
  document.getElementById("res-record").textContent =
    nouveauRecord ? "🌟 NOUVEAU RECORD DU GARAGE !" : "Record du garage : " + record;
  document.getElementById("voile-resultat").classList.remove("cache");

  if (gagne) { confettis(); sonVictoire(); } else { sonDefaite(); }
  metAJourTout();
}

function choisisVerdict(stats) {
  if (stats.bizarre >= 20) return {
    emoji: "🌀", titre: "MACHINE À RÊVER",
    texte: "La voiture ne va plus nulle part : elle va ailleurs. Elle a vu trois lunes et une pizza volante.",
  };
  if (stats.vitesse >= 24 && stats.bizarre >= 8) return {
    emoji: "🚀", titre: "MONSTRE LÉGENDAIRE",
    texte: "La voiture a arraché une étoile en passant. Le garage a fondu. C'est superbe.",
  };
  if (stats.vitesse >= 24) return {
    emoji: "⚡", titre: "CHAMPION DE L'ASPHALTE",
    texte: "Vite, propre, efficace. Les adultes sont un peu jaloux.",
  };
  if (stats.pollution >= 16) return {
    emoji: "☁️", titre: "NUAGE OFFICIEL",
    texte: "La voiture laisse un petit nuage noir derrière elle. Les mouettes ont porté plainte.",
  };
  if (stats.bruit >= 16) return {
    emoji: "🔊", titre: "TROOUM OFFICIEL",
    texte: "Le voisin a emmené son chien chez sa sœur. Il a dit « la météo ». Il mentait.",
  };
  if (stats.vitesse < 8) return {
    emoji: "🐢", titre: "TORTUE D'HONNEUR",
    texte: "Elle avance. Lentement, fièrement. Le bus de cantine pleure.",
  };
  return {
    emoji: "👍", titre: "BONNE VIEILLE MACHINE",
    texte: "Ni trop sérieuse, ni trop farfelue. Elle fait son travail et ça va.",
  };
}

function confettis() {
  const couleurs = ["#ff8c1a", "#e63946", "#4361ee", "#2a9d8f", "#ffd166", "#c77dff"];
  for (let i = 0; i < 80; i++) {
    const c = document.createElement("i");
    c.className = "confetti";
    c.style.left = Math.random() * 100 + "vw";
    c.style.background = couleurs[i % couleurs.length];
    c.style.setProperty("--d", (1.6 + Math.random() * 1.6).toFixed(2) + "s");
    c.style.animationDelay = (Math.random() * 0.5).toFixed(2) + "s";
    document.body.append(c);
    setTimeout(() => c.remove(), 4200);
  }
}

/* ============================================================
   7. Les boutons
   ============================================================ */

function attacheBoutons() {
  document.getElementById("bouton-go").addEventListener("click", () => {
    if (courseEnCours) return;
    const stats = calculeStats();
    if (stats.nombre === 0) {
      braise(choisis(PHRASES_MOTEUR_VIDE));
      secoueMoteur();
      return;
    }
    lanceCourse(stats);
  });

  document.getElementById("bouton-vider").addEventListener("click", () => {
    if (courseEnCours) return;
    if (fichesEtat.every((f) => f === null)) {
      braise("Il n'y a rien à vider !");
      return;
    }
    fichesEtat[0] = fichesEtat[1] = fichesEtat[2] = null;
    braise(choisis(PHRASES_VIDAGE));
    metAJourTout();
  });

  document.getElementById("bouton-revoir").addEventListener("click", () => {
    document.getElementById("voile-resultat").classList.add("cache");
  });

  document.getElementById("bouton-nouveau").addEventListener("click", () => {
    fichesEtat[0] = fichesEtat[1] = fichesEtat[2] = null;
    document.getElementById("voile-resultat").classList.add("cache");
    braise(choisis(PHRASES_VIDAGE));
    metAJourTout();
  });

  const boutonSon = document.getElementById("bouton-son");
  boutonSon.textContent = mute ? "🔇" : "🔊";
  boutonSon.addEventListener("click", () => {
    mute = !mute;
    ecrireMemoire("mf-mute", mute ? "1" : "0");
    boutonSon.textContent = mute ? "🔇" : "🔊";
    if (mute) arreteHum();
  });

  // les fiches du moteur
  for (const fiche of document.querySelectorAll(".fiche")) {
    const index = parseInt(fiche.dataset.fiche, 10);
    attacheGlisser(fiche, () => fichesEtat[index], index);
  }
}

/* ============================================================
   8. Demarrage
   ============================================================ */

construitEtabli();
attacheBoutons();
metAJourTout();
braise(PHRASES_INTRO);
</script>
